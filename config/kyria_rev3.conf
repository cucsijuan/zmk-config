# Uncomment these two line to add support for encoders to your firmware
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Kyria OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# WS2812_STRIP enables the led_strip driver itself (needed by zmk-rgb-layer
# below to drive the LEDs directly). ZMK_RGB_UNDERGLOW stays off: ZMK's own
# underglow subsystem would fight over the same LED strip and restore its
# own saved color/effect at boot, overwriting whatever zmk-rgb-layer sets.
CONFIG_WS2812_STRIP=y

# Enable custom RGB layer control
CONFIG_ZMK_RGB_LAYER=y

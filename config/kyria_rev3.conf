# Uncomment these two line to add support for encoders to your firmware
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Kyria OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# SPI is required by the ws2812_spi driver backend below (the LED strip is
# wired on spi3). It has no devicetree-based auto-default in Zephyr, so it
# must be enabled explicitly - previously CONFIG_ZMK_RGB_UNDERGLOW pulled it
# in indirectly, but that's off here.
CONFIG_SPI=y

# LED_STRIP is the umbrella subsystem WS2812_STRIP lives under (it's a no-op
# without it - normally ZMK_RGB_UNDERGLOW enables it via `select`, but that's
# off here). WS2812_STRIP is the actual driver zmk-rgb-layer drives the LEDs
# through. ZMK_RGB_UNDERGLOW itself stays off: ZMK's own underglow subsystem
# would fight over the same LED strip and restore its own saved color/effect
# at boot, overwriting whatever zmk-rgb-layer sets.
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y

# Enable custom RGB layer control
CONFIG_ZMK_RGB_LAYER=y
